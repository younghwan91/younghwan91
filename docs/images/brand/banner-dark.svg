<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" fill="none" role="img" aria-label="Younghwan Chae, Ph.D. — Open-source quant infrastructure &amp; numerical optimization systems">
  <defs>
    <linearGradient id="yh-bd-card" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="yh-bd-grad" x1="0%" y1="0%" x2="100%" y2="100%">
