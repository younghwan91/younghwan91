  <!-- Subtle grid -->
  <g stroke="#2DD4BF" stroke-opacity="0.06" stroke-width="1">
    <path d="M640 0 V280 M700 0 V280 M760 0 V280 M820 0 V280 M880 0 V280 M940 0 V280 M1000 0 V280 M1060 0 V280 M1120 0 V280"/>
    <path d="M620 56 H1200 M620 112 H1200 M620 168 H1200 M620 224 H1200"/>
  </g>

  <!-- Brand mark (64x64 at 56,52) -->
  <g transform="translate(56, 52)">
    <rect width="64" height="64" rx="14" fill="url(#yh-bd-grad)"/>
    <rect x="4" y="4" width="56" height="56" rx="11" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"/>
    <path d="M14 44 L25 33 L33 38 L48 19" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="48" cy="19" r="4" fill="#FFFFFF"/>
    <circle cx="25" cy="33" r="2.75" fill="#99F6E4"/>
    <circle cx="33" cy="38" r="2.75" fill="#99F6E4"/>
    <path d="M14 49 H50" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Title & Tagline -->
  <text x="138" y="95" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.6">Younghwan Chae, Ph.D.</text>
  <text x="56" y="156" fill="#CBD5E1" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18.5" font-weight="500">Open-source quant infrastructure &amp; numerical optimization systems.</text>

  <!-- Tech pills -->
  <rect x="56" y="186" width="212" height="32" rx="16" fill="#0F766E" fill-opacity="0.35" stroke="#2DD4BF" stroke-opacity="0.45" stroke-width="1"/>
  <text x="162" y="207" text-anchor="middle" fill="#99F6E4" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="600">Quant · Optimization</text>

  <rect x="280" y="186" width="220" height="32" rx="16" fill="#1E3A8A" fill-opacity="0.45" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="1"/>
  <text x="390" y="207" text-anchor="middle" fill="#BFDBFE" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="600">ML &amp; Perception · AI</text>

