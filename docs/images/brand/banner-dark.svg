    <rect x="836" y="192" width="108" height="32" rx="8" fill="#EA580C"/>
    <text x="890" y="212" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">quantbox</text>

    <rect x="1004" y="192" width="136" height="32" rx="8" fill="#059669"/>
    <text x="1072" y="212" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">crypto-insights</text>

    <!-- Node dots -->
    <circle cx="836" cy="68" r="3" fill="#99F6E4"/>
    <circle cx="1004" cy="68" r="3" fill="#99F6E4"/>
    <circle cx="836" cy="156" r="3" fill="#FDE68A"/>
    <circle cx="1004" cy="156" r="3" fill="#A7F3D0"/>
    <circle cx="836" cy="208" r="3" fill="#FED7AA"/>
