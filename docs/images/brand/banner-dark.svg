    <rect x="836" y="140" width="108" height="32" rx="8" fill="#D97706"/>
    <text x="890" y="160" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">DuckDB</text>

    <rect x="1004" y="140" width="136" height="32" rx="8" fill="#059669"/>
    <text x="1072" y="160" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">portfolio-research</text>

    <!-- Row 3: Crypto -->
