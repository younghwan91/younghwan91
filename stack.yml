# 오픈소스 퀀트 스택 — 레포 간 "관련 프로젝트" 푸터의 단일 진실 원천(SSOT).
#
# 각 레포 README 하단의 푸터 표는 손으로 쓰지 않는다. scripts/sync_stack_footer.py 가
# 이 파일에서 생성해 주입한다. 손으로 고치면 다음 동기화에서 덮어써진다.
#
# 규칙 — 설명에 숫자를 쓰지 않는다.
#   "207개 엔드포인트" 같은 수치를 8개 레포에 복사해 둔 결과, 실제 값이 186으로
#   바뀐 뒤에도 7개 레포가 몇 달간 틀린 숫자로 서로를 소개했다. 숫자는 해당
#   레포의 README 본문에서만 관리한다.

axes:
  kr: { mark: "🇰🇷", ko: "한국 주식", en: "Korean equities" }
  us: { mark: "🇺🇸", ko: "미국 주식", en: "US equities" }
  cx: { mark: "₿",  ko: "암호화폐",  en: "Crypto" }

repos:
  - name: kiwoom-client
    axis: kr
    ko: "키움증권 REST API Python 라이브러리 — 국내주식 엔드포인트 전수·실시간 WebSocket, sync + async (`pip install kiwoom-client`)"
    en: "Kiwoom Securities REST API client — full domestic-equity endpoint coverage, real-time WebSocket, sync + async (`pip install kiwoom-client`)"

  - name: krx-fundamentals-client
    axis: kr
    ko: "국내 기업 펀더멘탈 Python 클라이언트 라이브러리 — 재무제표·투자지표·배당·종목 스크리닝 (DART + KRX + 네이버)"
    en: "Korean corporate fundamentals Python client library — financial statements, valuation, dividends, screening (DART + KRX + Naver)"

  - name: krx-news-client
    axis: kr
    ko: "한국 주식 뉴스·공시를 한 스키마로 내주는 Python 클라이언트 라이브러리 (DART + 토스증권)"
    en: "Korean market news & disclosures as one schema — Python client library (DART + Toss Securities)"

  - name: krx-quant-core
    axis: kr
    ko: "한국 주식 퀀트 시스템 공통 Python 코어 — KRX 호가·가격제한폭·세션 규칙, 시행일별 거래세 비용모델, 키움 주문 가드, DART 중대공시 위험 분류, 체결 시뮬레이션, Deflated Sharpe·purged CV 통계"
    en: "Shared Python core for Korean-equity quant systems — KRX tick, price-limit and session rules, date-aware transaction-tax cost model, Kiwoom order guards, DART material-disclosure risk classification, fill simulation, Deflated Sharpe and purged CV stats"

  - name: fin-checkup
    axis: kr
    ko: "관심종목 위험 공시 텔레그램 알림 + DART·SEC 재무 건강검진 — 측정값과 사실만 전달한다"
    en: "Telegram alerts for risk disclosures + a DART/SEC financial health checkup — reports measurements and facts, never a recommendation"

  - name: quant-airflow
    axis: kr
    ko: "시세·수급·실적을 TimescaleDB 로 수집하는 Airflow 파이프라인 — 상장폐지 종목까지 담아 생존편향을 막는다"
    en: "Airflow pipeline collecting Korean market data into TimescaleDB — delisted names included, so downstream backtests aren't survivorship-biased"

  - name: swing-it
    axis: kr
    ko: "코스피·코스닥 알파 심사 프레임워크 — 개별 트레이드 분포로 판정하고 랜덤 음성대조·purged CV·Deflated Sharpe 를 CI 가드레일로 강제"
    en: "KOSPI/KOSDAQ alpha validation framework — judged on the per-trade distribution, with random null controls, purged CV and Deflated Sharpe enforced as CI guardrails"

  - name: portfolio-research
    axis: us
    ko: "미국주식 팩터 엔진 — point-in-time·생존편향 보정 데이터 위에서 walk-forward 를 Deflated Sharpe·PBO 로 게이팅하고 ETF 전술배분도 같은 관문을 지난다"
    en: "US equity factor engine — walk-forward gated by Deflated Sharpe and PBO on point-in-time, survivorship-bias-free data; tactical ETF allocation goes through the same gate"

  - name: macro-sector-agent
    axis: us
    ko: "하향식 미국 산업 사이클 리서치 — \"어느 산업이 잊혔나\"를 묻고 기계는 제외만 한다"
    en: "Top-down US sector-cycle research — asks which industry has been forgotten, not what to buy; the machine excludes, never picks"

  - name: automated-stock-trading-systems
    axis: us
    ko: "Bensdorp 의 7개 비상관 트레이딩 시스템 백테스터 (교육용 재구현)"
    en: "Backtester for Bensdorp's seven non-correlated trading systems (educational reimplementation)"

  - name: binance-quant-engine
    axis: cx
    ko: "암호화폐 선물 백테스트·실행 엔진 — 룩어헤드 0, 백테스트↔실거래 일체화"
    en: "Crypto futures backtest & execution engine — zero lookahead, backtest↔live parity"

  - name: crypto-quant-insights
    axis: cx
    ko: "실거래 선물 시스템을 검증하며 나온 차트 연구 노트 — 폭락 스트레스 테스트·Kelly 레버리지·체결 간극"
    en: "Chart-backed research notes from validating a live futures system — crash stress tests, Kelly leverage, live/backtest execution gaps"
